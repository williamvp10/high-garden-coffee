services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coffee
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecutar scripts/init_env.py}
    ports: ["127.0.0.1:${DB_PORT:-55433}:5432"]
    volumes: ["coffee_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffee"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://coffee:${POSTGRES_PASSWORD}@postgres:5432/coffee
    ports: ["127.0.0.1:${API_PORT:-8200}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 15
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      PORT: 3000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["127.0.0.1:${WEB_PORT:-3200}:3000"]
    depends_on:
      api: {condition: service_healthy}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  coffee_pg:
